{% extends "base.html" %}
{% block title %}Profile — {{ site_name }}{% endblock %}
{% block content %}
<div class="form-box">
  <h1>My profile</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email <input type="email" value="{{ current_user.email }}" disabled></label>
    <label>Name <input type="text" name="name" value="{{ current_user.name }}" maxlength="120"></label>
    <h3>Change password</h3>
    <label>Current password <input type="password" name="current_password"></label>
    <label>New password <input type="password" name="new_password" minlength="8"></label>
    <button class="btn" type="submit">Save</button>
  </form>
</div>
{% endblock %}
